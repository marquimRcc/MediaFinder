<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo arredondado estilo App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="8" />
  
  <!-- Círculo de brilho central -->
  <circle cx="256" cy="256" r="140" fill="url(#accent)" opacity="0.18" filter="url(#glow)" />
  
  <!-- Ícone Play + Antena Cast estilizados -->
  <path d="M 210,170 L 350,256 L 210,342 Z" fill="url(#accent)" filter="url(#glow)" />
  
  <!-- Arcos Cast no canto -->
  <path d="M 150,330 A 20,20 0 0,1 170,350" stroke="#818cf8" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M 150,290 A 60,60 0 0,1 210,350" stroke="#818cf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 150,250 A 100,100 0 0,1 250,350" stroke="#818cf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />
</svg>
